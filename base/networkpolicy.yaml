apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-processing-netpol
  labels:
    app.kubernetes.io/name: order-processing-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-processing-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Ingress controller namespace / pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-basic
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-processing-api
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to external HTTPS (Azure SQL, Cosmos DB, Managed Identities)
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 1433
