# Production-grade ArgoCD Helm values for Azure Kubernetes Service (AKS)
global:
  domain: argocd.deenanathdevops.com

configs:
  params:
    server.insecure: true # Terminate TLS at Azure App Gateway / Ingress Controller

  cm:
    url: "https://argocd.deenanathdevops.com"
    timeout.reconciliation: 180s
    application.instanceLabelKey: "argocd.argoproj.io/instance"

    # Microsoft Entra ID (Azure AD) SSO Integration via OIDC (Dex)
    dex.config: |
      connectors:
        - type: microsoft
          id: azure
          name: Microsoft Entra ID
          config:
            clientID: $argocd-azure-secret:clientId
            clientSecret: $argocd-azure-secret:clientSecret
            tenant: $argocd-azure-secret:tenantId
            redirectURI: https://argocd.deenanathdevops.com/api/dex/callback

  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, "azure-ad-cluster-admins", role:admin
      g, "azure-ad-devops-engineers", role:admin
      g, "azure-ad-developers", role:readonly

# High Availability (HA) Settings for Production
controller:
  replicas: 2
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  metrics:
    enabled: true

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

redis-ha:
  enabled: true

applicationSet:
  replicas: 2
