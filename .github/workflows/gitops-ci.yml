name: "GitOps Manifest Validation CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: "Validate Kubernetes & Kustomize Manifests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Kustomize"
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: "Set up Kubeconform"
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: "Validate Kustomize Build - Base"
        run: |
          echo "Building Base manifests..."
          kustomize build base | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

      - name: "Validate Kustomize Build - Dev Overlay"
        run: |
          echo "Building Dev Overlay..."
          kustomize build environments/dev | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

      - name: "Validate Kustomize Build - Staging Overlay"
        run: |
          echo "Building Staging Overlay..."
          kustomize build environments/staging | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

      - name: "Validate Kustomize Build - Prod Overlay"
        run: |
          echo "Building Prod Overlay..."
          kustomize build environments/prod | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

      - name: "Validate ArgoCD Application CRDs Syntax"
        run: |
          echo "Validating ArgoCD Custom Resource Definitions (YAML syntax)..."
          python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('apps/*.yaml') + glob.glob('bootstrap/*.yaml')]; print('All ArgoCD CRD YAML files are syntactically valid.')"
