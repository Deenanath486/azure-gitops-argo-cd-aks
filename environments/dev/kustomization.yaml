apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev-orders

resources:
  - ../../base

namePrefix: dev-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: order-processing-api
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.orders.deenanathdevops.com
    target:
      kind: Ingress
      name: order-processing-api

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Development
      - LOG_LEVEL=Debug
      - CACHE_TTL_SECONDS=60
